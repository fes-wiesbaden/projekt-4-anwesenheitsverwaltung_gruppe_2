spring.application.name=attendance-management

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/attendancemanagementdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}

spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin}

spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
server.port=${SERVER_PORT:4200}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs

# JWT Config
app.jwt.secret=${APP_JWT_SECRET:j5U+t6u8tUterZUt5698sHJk56ZUGH23}
# 15 minutes (short-lived for security)
app.jwt.expiration.ms=900000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# School-local attendance clock and session scheduler
app.attendance.zone=${ATTENDANCE_TIME_ZONE:Europe/Berlin}
app.attendance.scheduler-delay-ms=${ATTENDANCE_SCHEDULER_DELAY_MS:15000}
mqtt.reconnect-delay-ms=${MQTT_RECONNECT_DELAY_MS:5000}
